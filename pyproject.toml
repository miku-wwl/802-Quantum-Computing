[project]
name = "mse802-assessment2"
version = "0.1.0"
description = "Reproducible local environment for MSE802 Quantum Computing Assessment 2"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cirq>=1.4,<2",
    "ipykernel>=6.29,<7",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.2,<5",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pillow>=10.4,<13",
    "pylatexenc>=2.10,<3",
    "python-docx>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "pytest>=8.3,<9",
    "qiskit[visualization]>=2,<3",
    "qiskit-aer>=0.17,<1",
    "qiskit-machine-learning>=0.8,<1",
    "requests>=2.32,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "seaborn>=0.13,<1",
    "sympy>=1.13,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
